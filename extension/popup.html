<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    width: 300px; margin: 0; padding: 14px 16px;
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #1b1b1c; color: #fafafa;
  }
  h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #81858c; }
  .dot.ok { background: #4ed17e; }
  .dot.bad { background: #f25a5a; }
  .status { flex: 1; min-width: 0; font-size: 12px; color: #adb2b8;
            overflow-wrap: anywhere; }
  label { display: block; font-size: 11px; color: #81858c; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; height: 28px; padding: 0 8px;
          border-radius: 8px; border: 1px solid #ffffff1f; background: #232324;
          color: #fafafa; font: inherit; outline: none; }
  button { width: 100%; height: 30px; margin-top: 10px; border: 0; border-radius: 8px;
           background: #353638; color: #fafafa; font: inherit; cursor: pointer; }
  button:hover { background: #43454a; }
  .hint { margin-top: 10px; font-size: 11px; line-height: 1.5; color: #81858c; }
</style>
</head>
<body>
  <h1>DSH Tab Bridge</h1>

  <div class="row">
    <span id="dot" class="dot"></span>
    <span id="status" class="status" data-i18n="statusReading">Reading…</span>
  </div>

  <div class="row" style="margin-bottom:0">
    <div style="flex:1">
      <label for="port" data-i18n="labelPort">Bridge port</label>
      <input id="port" type="number" min="1" max="65535" placeholder="43130">
    </div>
  </div>

  <button id="save" data-i18n="btnSave">Save and push now</button>

  <p class="hint" id="hint"></p>

  <script src="popup.js"></script>
</body>
</html>
